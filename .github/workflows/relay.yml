name: X to Telegram

on:
  schedule:
    - cron: "*/5 * * * *"  # GitHub runs these late under load; expect 5-15 min
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python3 relay.py
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
          TG_VISUAL_THREAD_ID: "4"  # Content topic: images/videos/GIFs/stickers only
      # ponytail: DualMint rides on Bandit's X key + bot (anonymous admin there, posts show as the group); give it its own bot/repo if it needs to be separate
      - name: DualMint relay (@DualMintRWA → General)
        if: always()
        run: python3 relay.py
        env:
          X_HANDLE: DualMintRWA
          STATE_FILE: state-dualmint.json
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: "-1003922336252"
      - name: Save state
        if: always()
        run: |
          git config user.name "bandit-relay"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json state-dualmint.json 2>/dev/null || git add state.json
          git diff --cached --quiet || (git commit -m "relay state" && git push)
